<!DOCTYPE html>
<html>
<head>
    <title>Course Management System</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        input {
            width: 170px;
        }

        button {
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1f4e79;
            color: white;
        }

        .delete {
            background: #d9534f;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Course Management System</h1>

    <div class="form">
        <input type="text" id="course_id" placeholder="Course ID">
        <input type="text" id="course_name" placeholder="Course Name">
        <input type="text" id="department" placeholder="Department">
        <input type="text" id="instructor" placeholder="Instructor">
        <input type="number" id="duration" placeholder="Duration">
        <button onclick="addCourse()">Add Course</button>
        <input type="text" id="search" placeholder="Search Course" onkeyup="searchCourses()">
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Course Name</th>
                <th>Department</th>
                <th>Instructor</th>
                <th>Duration</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="courseTable"></tbody>
    </table>

</div>

<script>
const API = "/api/courses/";

function loadCourses() {
    fetch(API)
        .then(response => response.json())
        .then(data => {
            let table = document.getElementById("courseTable");
            table.innerHTML = "";

            data.forEach(course => {
                table.innerHTML += `
                    <tr>
                        <td>${course.course_id}</td>
                        <td>${course.course_name}</td>
                        <td>${course.department}</td>
                        <td>${course.instructor}</td>
                        <td>${course.duration}</td>
                        <td>
                        <button onclick="editCourse(${course.id})">
                            Edit
                             </button>
                             <button class= "delete"
                                onclick="deleteCourse(${course.id})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        });
}
function searchCourses() {
    let search = document.getElementById("search").value.toLowerCase();
    let rows = document.querySelectorAll("#courseTable tr");

    rows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(search)
            ? ""
            : "none";
    });
}

function addCourse() {
    let course = {
        course_id: document.getElementById("course_id").value,
        course_name: document.getElementById("course_name").value,
        department: document.getElementById("department").value,
        instructor: document.getElementById("instructor").value,
        duration: document.getElementById("duration").value
    };

    fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(course)
    })
    .then(response => response.json())
    .then(() => {
        loadCourses();
    });
}
function editCourse(id) {
    let name = prompt("Enter new course name:");
    if (!name) return;

    fetch(API + id + "/", {
        method: "PATCH",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            course_name: name
        })
    })
    .then(() => loadCourses());
}

function deleteCourse(id) {
    fetch(API + id + "/", {
        method: "DELETE"
    })
    .then(() => loadCourses());
}

loadCourses();
</script>

</body>
</html>
